<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MRE Halloween Carnival Volunteer Check-In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
<style>
  /* Haunted night palette (always dark, it's Halloween) */
  :root {
    --bg: #1b1029; --card: #2a1b3d; --ink: #f6f0ff; --muted: #b9a9d0; --line: #45305f;
    --accent: #ff7a1a; --accent-ink: #1b1029;
    --here: #7fe0a8; --here-bg: #17392a; --done: #c1b6ff; --done-bg: #2e2752;
    --exp: #ffcf5a; --exp-bg: #3b2c12; --warn: #ff8a80;
    --tape: #ffd23f; --tape-ink: #141414;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); min-height: 100vh;
         background: radial-gradient(ellipse at 85% -10%, #4a2a6e 0%, transparent 55%),
                     radial-gradient(ellipse at 0% 110%, #3a1a3a 0%, transparent 50%), var(--bg);
         background-attachment: fixed;
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 0; }
  .hidden { display: none !important; }

  /* Login */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
                padding: 24px; width: 100%; max-width: 380px; }
  .login-card p { color: var(--muted); margin: 6px 0 18px; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 12px 0 4px; }
  input, select { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px;
                  background: var(--bg); color: var(--ink); }
  .btn { border: 0; border-radius: 10px; padding: 12px 16px; cursor: pointer; font-weight: 600; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn:disabled { opacity: .5; cursor: default; }
  .full { width: 100%; margin-top: 18px; }
  .err { color: var(--warn); font-size: .9rem; min-height: 1.2em; margin-top: 10px; }

  /* Header */
  header { position: sticky; top: 0; z-index: 5; background: rgba(27, 16, 41, .93);
           backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .sub { color: var(--muted); font-size: .85rem; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; }
  .stat b { display: block; font-size: 1.5rem; }
  .stat.active { outline: 2px solid var(--accent); }
  .filters { display: grid; grid-template-columns: 1fr 160px; gap: 8px; }
  @media (max-width: 520px) { .filters { grid-template-columns: 1fr; } }

  /* List */
  .list { display: grid; gap: 10px; margin-top: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
          display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
  .name { font-weight: 700; font-size: 1.05rem; }
  .meta { color: var(--muted); font-size: .9rem; }
  .times { font-size: .85rem; margin-top: 4px; }
  .pill { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
  .p-expected { background: var(--exp-bg); color: var(--exp); }
  .p-here { background: var(--here-bg); color: var(--here); }
  .p-done { background: var(--done-bg); color: var(--done); }
  .p-flag { background: var(--line); color: var(--muted); }
  .actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; min-width: 120px; }
  .btn-in { background: var(--here); color: #0e2418; }
  .btn-out { background: var(--done); color: #1b1029; }
  .link { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: .8rem; padding: 2px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  /* Toast + dialog */
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
           padding: 10px 16px; border-radius: 10px; font-size: .9rem; z-index: 20; max-width: calc(100% - 32px); }
  dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); width: min(420px, calc(100% - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .row { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }

  /* ===== Halloween decor ===== */
  #login, #app { position: relative; z-index: 1; }
  #login { overflow: hidden; }
  .spooky { font-family: "Creepster", system-ui, cursive; font-weight: 400; letter-spacing: .04em; color: var(--accent);
            text-shadow: 0 2px 0 #000, 0 0 18px rgba(255, 122, 26, .45); }
  .eyebrow { font-weight: 800; letter-spacing: .3em; font-size: .8rem; color: var(--muted); }
  .login-card { position: relative; text-align: center; margin-top: 56px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 122, 26, .15); }
  .login-card form, .login-card label, .login-card input { text-align: left; }
  .login-card h1.spooky { font-size: 2.6rem; line-height: 1; margin: 6px 0 2px; }
  .kicker { font-size: 1.15rem; font-weight: 700; color: var(--ink) !important; margin: 6px 0 2px !important; }
  .peek-ghost { position: absolute; width: 92px; left: 50%; top: -74px; transform: translateX(-50%);
                animation: floaty 3.6s ease-in-out infinite; filter: drop-shadow(0 6px 10px rgba(0,0,0,.4)); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 38px; flex: none; animation: floaty 3.6s ease-in-out infinite; }
  .brand h1.spooky { font-size: 1.6rem; line-height: 1.05; }
  .brand .small { font-weight: 700; font-size: .95rem; }

  /* Caution tape */
  .tape { position: absolute; left: -20%; width: 140%; height: 40px; z-index: 0; overflow: hidden;
          background: var(--tape); color: var(--tape-ink); font-weight: 900; letter-spacing: .18em;
          font-size: .85rem; white-space: nowrap; display: flex; align-items: center;
          box-shadow: 0 6px 18px rgba(0,0,0,.45); }
  .tape::before, .tape::after { content: ""; position: absolute; left: 0; right: 0; height: 6px;
          background: repeating-linear-gradient(-45deg, var(--tape-ink) 0 10px, var(--tape) 10px 20px); }
  .tape::before { top: 0; } .tape::after { bottom: 0; }
  .tape span { display: inline-block; padding-left: 20px; animation: tapeScroll 30s linear infinite; }
  .tape-a { top: 7%; transform: rotate(-6deg); }
  .tape-b { bottom: 9%; transform: rotate(5deg); }
  .tape-strip { position: relative; left: 0; width: 100%; height: 26px; font-size: .7rem; transform: none; box-shadow: none; }
  .tape-strip::before, .tape-strip::after { height: 4px; }

  /* Night sky layer */
  .sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .moon { position: absolute; top: 28px; right: 6%; width: 86px; height: 86px; border-radius: 50%;
          background: radial-gradient(circle at 35% 35%, #fff7d6, #ffe08a 60%, #f4c35a);
          box-shadow: 0 0 40px 12px rgba(255, 224, 138, .25); }
  .moon::after { content: ""; position: absolute; width: 16px; height: 12px; border-radius: 50%;
                 background: rgba(214, 170, 80, .45); top: 46px; left: 22px; box-shadow: 26px -18px 0 -2px rgba(214,170,80,.4); }
  .bat { position: absolute; left: -12vw; width: 64px; animation: fly linear infinite; }
  .bat .wing { transform-box: fill-box; animation: flap .28s ease-in-out infinite alternate; }
  .bat .wl { transform-origin: right center; } .bat .wr { transform-origin: left center; }
  .sky-ghost { position: absolute; width: 70px; opacity: .55; animation: floaty 4.5s ease-in-out infinite; }

  @keyframes floaty { 0%, 100% { translate: 0 0; } 50% { translate: 0 -10px; } }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.35); } }
  @keyframes fly {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(32vw, -26px); }
    50%  { transform: translate(64vw, 14px); }
    75%  { transform: translate(96vw, -18px); }
    100% { transform: translate(128vw, 6px); }
  }
  @keyframes tapeScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (max-width: 520px) {
    .moon { width: 60px; height: 60px; } .brand h1.spooky { font-size: 1.3rem; } .brand svg { width: 30px; }
    .sky-ghost { width: 50px; }
    .top { align-items: flex-start; }
    .top .btn { padding: 8px 10px; font-size: .8rem; }
  }
  .top .btn { white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .bat { display: none; }
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<!-- Reusable original artwork: a cute ghost -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ghost" viewBox="0 0 100 120">
    <path d="M12 58 Q12 10 50 10 Q88 10 88 58 L88 106 Q80 96 72 106 Q64 116 56 106 Q50 98 44 106 Q36 116 28 106 Q20 96 12 106 Z"
          fill="#f8f4ff" stroke="#d9cdf0" stroke-width="2"/>
    <path d="M12 70 Q2 66 4 56 Q12 60 14 64 Z M88 70 Q98 66 96 56 Q88 60 86 64 Z" fill="#f8f4ff"/>
    <ellipse cx="38" cy="52" rx="6" ry="8" fill="#2a1f3d"/>
    <ellipse cx="62" cy="52" rx="6" ry="8" fill="#2a1f3d"/>
    <circle cx="40" cy="49" r="2.2" fill="#fff"/><circle cx="64" cy="49" r="2.2" fill="#fff"/>
    <ellipse cx="29" cy="64" rx="6" ry="3.5" fill="#ff9ec4" opacity=".7"/>
    <ellipse cx="71" cy="64" rx="6" ry="3.5" fill="#ff9ec4" opacity=".7"/>
    <ellipse cx="50" cy="68" rx="4" ry="5" fill="#2a1f3d"/>
  </symbol>
</svg>

<div class="sky" id="sky" aria-hidden="true"><div class="moon"></div></div>

<section id="login">
  <div class="tape tape-a" aria-hidden="true"><span class="tape-text"></span></div>
  <div class="tape tape-b" aria-hidden="true"><span class="tape-text"></span></div>
  <form class="login-card" id="loginForm">
    <svg class="peek-ghost" viewBox="0 0 100 120" aria-hidden="true"><use href="#ghost"/></svg>
    <div class="eyebrow">MRE</div>
    <h1 class="spooky">Halloween Carnival</h1>
    <p class="kicker">Volunteer Check-In</p>
    <p>Front desk access only.</p>
    <label for="deskName">Your name</label>
    <input id="deskName" autocomplete="name" placeholder="So we know who checked people in">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn btn-primary full" id="loginBtn" type="submit">Sign in</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<!-- ============ APP ============ -->
<section id="app" class="hidden">
  <header>
    <div class="tape tape-strip" aria-hidden="true"><span class="tape-text"></span></div>
    <div class="wrap">
      <div class="top">
        <div class="brand">
          <svg viewBox="0 0 100 120" aria-hidden="true"><use href="#ghost"/></svg>
          <div>
            <h1 class="spooky">MRE Halloween Carnival</h1>
            <div class="small">Volunteer Check-In</div>
            <div class="sub" id="syncInfo">Loading...</div>
          </div>
        </div>
        <div style="display:flex; gap:6px">
          <button class="btn btn-ghost" id="walkinBtn">+ Walk-in</button>
          <button class="btn btn-ghost" id="logoutBtn">Sign out</button>
        </div>
      </div>
      <div class="stats">
        <div class="stat" data-f="expected"><b id="nExp">0</b>Not here yet</div>
        <div class="stat" data-f="here"><b id="nHere">0</b>Here now</div>
        <div class="stat" data-f="done"><b id="nDone">0</b>Checked out</div>
      </div>
      <div class="filters">
        <input id="search" type="search" placeholder="Search name or organization" autocomplete="off">
        <select id="booth"><option value="">All organizations</option></select>
      </div>
    </div>
  </header>
  <main class="wrap">
    <div class="list" id="list"></div>
  </main>
</section>

<dialog id="walkinDlg">
  <form method="dialog" id="walkinForm">
    <h2 style="margin:0 0 4px; font-size:1.2rem">Add walk-in</h2>
    <div class="sub">Someone who showed up but is not on the sign-up list. They get checked in right away.</div>
    <label for="wName">Name</label>
    <input id="wName" required>
    <label for="wBooth">Organization</label>
    <input id="wBooth" list="boothList">
    <datalist id="boothList"></datalist>
    <label for="wSlot">Time slot (optional)</label>
    <input id="wSlot" placeholder="e.g. 1:00pm - 1:30pm">
    <div class="row">
      <button class="btn btn-ghost" value="cancel" formnovalidate>Cancel</button>
      <button class="btn btn-primary" id="wSave" value="save">Check in</button>
    </div>
  </form>
</dialog>

<div id="toast" class="hidden"></div>

<script>
/* ===== Set this to your Apps Script web app URL (ends in /exec) ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbzaa-qhGjVoSRYZ8u2lKJW6C9yG0R-g6LwHK7ocZHSTY2YuPqCU7-VpHcKklZvUFWAfuA/exec';
const REFRESH_MS = 20000;

const $ = s => document.querySelector(s);
const state = { pw: '', desk: '', data: [], filter: '', booth: '', q: '', busy: new Set() };

/* ---------- storage (session only, so closing the tab signs out) ---------- */
function saveSession() {
  try { sessionStorage.setItem('ci', JSON.stringify({ pw: state.pw, desk: state.desk })); } catch (e) {}
}
function loadSession() {
  try { return JSON.parse(sessionStorage.getItem('ci') || 'null'); } catch (e) { return null; }
}
function clearSession() { try { sessionStorage.removeItem('ci'); } catch (e) {} }

/* ---------- API: text/plain POST avoids a CORS preflight that Apps Script cannot answer ---------- */
async function api(action, extra = {}) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, password: state.pw, deskName: state.desk, ...extra })
  });
  const out = await res.json();
  if (out.auth === false) { logout('Password changed or expired. Sign in again.'); throw new Error(out.error); }
  return out;
}

/* ---------- login ---------- */
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  state.pw = $('#pw').value;
  state.desk = $('#deskName').value.trim();
  $('#loginBtn').disabled = true; $('#loginErr').textContent = '';
  try {
    const r = await api('login');
    if (!r.ok) throw new Error(r.error || 'Sign in failed');
    saveSession(); startApp();
  } catch (err) {
    $('#loginErr').textContent = err.message === 'Failed to fetch' ? 'Cannot reach the server. Check the API URL.' : err.message;
  } finally { $('#loginBtn').disabled = false; }
});

function logout(msg) {
  clearSession(); state.pw = ''; clearInterval(state.timer);
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  $('#pw').value = ''; $('#loginErr').textContent = msg || '';
}
$('#logoutBtn').addEventListener('click', () => logout());

function startApp() {
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  refresh();
  clearInterval(state.timer);
  state.timer = setInterval(refresh, REFRESH_MS);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.pw) refresh(); });

/* ---------- data ---------- */
async function refresh() {
  try {
    const r = await api('list');
    if (!r.ok) throw new Error(r.error);
    state.data = r.volunteers;
    $('#syncInfo').textContent = 'Synced ' + r.serverTime + (state.desk ? '  |  Desk: ' + state.desk : '');
    fillBooths(); render();
  } catch (err) {
    $('#syncInfo').textContent = 'Sync failed, retrying. ' + err.message;
  }
}

function slotMinutes(slot) {
  const m = String(slot || '').match(/(\d{1,2}):(\d{2})\s*(am|pm)?/i);
  if (!m) return 99999;
  let h = +m[1] % 12; if ((m[3] || '').toLowerCase() === 'pm') h += 12;
  return h * 60 + +m[2];
}

function fillBooths() {
  const booths = [...new Set(state.data.map(v => v.booth).filter(Boolean))].sort();
  const sel = $('#booth'), cur = sel.value;
  sel.innerHTML = '<option value="">All organizations</option>' + booths.map(b => `<option>${esc(b)}</option>`).join('');
  sel.value = booths.includes(cur) ? cur : '';
  $('#boothList').innerHTML = booths.map(b => `<option value="${esc(b)}">`).join('');
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ---------- render ---------- */
function render() {
  const d = state.data;
  $('#nExp').textContent = d.filter(v => v.status === 'expected').length;
  $('#nHere').textContent = d.filter(v => v.status === 'here').length;
  $('#nDone').textContent = d.filter(v => v.status === 'done').length;
  document.querySelectorAll('.stat').forEach(s => s.classList.toggle('active', s.dataset.f === state.filter));

  const q = state.q.toLowerCase();
  const rows = d
    .filter(v => !state.filter || v.status === state.filter)
    .filter(v => !state.booth || v.booth === state.booth)
    .filter(v => !q || (v.name + ' ' + v.booth).toLowerCase().includes(q))
    .sort((a, b) => slotMinutes(a.slot) - slotMinutes(b.slot) || a.name.localeCompare(b.name));

  if (!rows.length) { $('#list').innerHTML = '<div class="empty">No volunteers match.</div>'; return; }

  $('#list').innerHTML = rows.map(v => {
    const busy = state.busy.has(v.key) ? 'disabled' : '';
    const label = { expected: 'Not here', here: 'Here', done: 'Done' }[v.status];
    const flag = (v.source !== 'roster' ? `<span class="pill p-flag">${esc(v.source)}</span>` : '')
               + (/^y/i.test(v.receipt || '') ? '<span class="pill p-flag">Needs hours receipt</span>' : '');
    let times = '';
    if (v.checkIn) times += `In ${esc(v.checkIn)}${v.checkInBy ? ' (' + esc(v.checkInBy) + ')' : ''}`;
    if (v.checkOut) times += `  |  Out ${esc(v.checkOut)}${v.minutes !== '' ? '  |  ' + esc(v.minutes) + ' min' : ''}`;
    let btns = '';
    if (v.status === 'expected') btns = `<button class="btn btn-in" data-act="checkin" data-key="${esc(v.key)}" ${busy}>Check in</button>`;
    if (v.status === 'here') btns = `<button class="btn btn-out" data-act="checkout" data-key="${esc(v.key)}" ${busy}>Check out</button>
                                     <button class="link" data-act="undo" data-key="${esc(v.key)}" ${busy}>Undo check-in</button>`;
    if (v.status === 'done') btns = `<button class="link" data-act="undo" data-key="${esc(v.key)}" ${busy}>Undo check-out</button>`;
    return `<div class="card">
      <div>
        <div class="name">${esc(v.name)}<span class="pill p-${v.status}">${label}</span>${flag}</div>
        <div class="meta">${esc(v.booth || 'No organization')}${v.grade ? '  |  Grade ' + esc(v.grade) : ''}${v.slot ? '  |  ' + esc(v.slot) : ''}</div>
        ${times ? `<div class="times">${times}</div>` : ''}
      </div>
      <div class="actions">${btns}</div>
    </div>`;
  }).join('');
}

/* ---------- actions ---------- */
$('#list').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const { act, key } = b.dataset;
  const v = state.data.find(x => x.key === key);
  if (act === 'undo' && !confirm(`Undo for ${v ? v.name : 'this volunteer'}?`)) return;
  await doAction(act, { key });
});

async function doAction(act, payload) {
  const key = payload.key;
  if (key) { state.busy.add(key); render(); }
  try {
    const r = await api(act, payload);
    if (!r.ok) throw new Error(r.error);
    if (r.removed) state.data = state.data.filter(x => x.key !== r.removed);
    else if (r.record) {
      const i = state.data.findIndex(x => x.key === r.record.key);
      if (i === -1) state.data.push(r.record); else state.data[i] = r.record;
    }
    const n = r.record ? r.record.name : 'Volunteer';
    toast({ checkin: `${n} checked in`, checkout: `${n} checked out`, undo: 'Undone', walkin: `${n} added and checked in` }[act]);
    fillBooths();
  } catch (err) {
    toast(err.message);
    refresh();
  } finally {
    if (key) state.busy.delete(key);
    render();
  }
}

/* ---------- filters ---------- */
$('#search').addEventListener('input', e => { state.q = e.target.value; render(); });
$('#booth').addEventListener('change', e => { state.booth = e.target.value; render(); });
document.querySelectorAll('.stat').forEach(s => s.addEventListener('click', () => {
  state.filter = state.filter === s.dataset.f ? '' : s.dataset.f; render();
}));

/* ---------- walk-in ---------- */
$('#walkinBtn').addEventListener('click', () => { $('#walkinForm').reset(); $('#walkinDlg').showModal(); });
$('#walkinDlg').addEventListener('close', async () => {
  if ($('#walkinDlg').returnValue !== 'save') return;
  const name = $('#wName').value.trim(); if (!name) return;
  await doAction('walkin', { name, booth: $('#wBooth').value.trim(), slot: $('#wSlot').value.trim() });
});

/* ---------- toast ---------- */
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), 2600);
}

/* ---------- Halloween decor ---------- */
(function decorate() {
  const phrase = 'CAUTION  •  SPOOKY VOLUNTEERS AHEAD  •  ';
  document.querySelectorAll('.tape-text').forEach(t => { t.textContent = phrase.repeat(16); });

  const bat = (top, dur, delay, scale) => `
    <svg class="bat" viewBox="0 0 120 60" style="top:${top}%; animation-duration:${dur}s; animation-delay:${delay}s; width:${64 * scale}px">
      <path class="wing wl" fill="#0d0716" d="M52 28 Q40 8 18 12 Q26 20 20 28 Q12 26 2 32 Q18 34 20 44 Q30 36 40 42 Q44 34 52 38 Z"/>
      <path class="wing wr" fill="#0d0716" d="M68 28 Q80 8 102 12 Q94 20 100 28 Q108 26 118 32 Q102 34 100 44 Q90 36 80 42 Q76 34 68 38 Z"/>
      <path fill="#0d0716" d="M53 20 L55 10 L59 18 L61 18 L65 10 L67 20 Z"/>
      <ellipse cx="60" cy="31" rx="10" ry="13" fill="#0d0716"/>
      <circle cx="56" cy="27" r="2.3" fill="#ffcf5a"/><circle cx="64" cy="27" r="2.3" fill="#ffcf5a"/>
      <path d="M57 35 L58.5 38.5 L60 35 L61.5 38.5 L63 35" fill="none" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
    </svg>`;
  const ghost = (css, delay) =>
    `<svg class="sky-ghost" viewBox="0 0 100 120" style="${css}; animation-delay:${delay}s"><use href="#ghost"/></svg>`;

  $('#sky').insertAdjacentHTML('beforeend',
    bat(14, 19, 0, 1) + bat(30, 26, 7, .7) + bat(9, 23, 14, .85) +
    ghost('left:3%; bottom:12%', 0) + ghost('right:4%; top:42%', 1.4) + ghost('left:44%; bottom:2%; width:46px', 2.6));
})();

/* ---------- boot ---------- */
const sess = loadSession();
if (sess && sess.pw) { state.pw = sess.pw; state.desk = sess.desk || ''; $('#deskName').value = state.desk; startApp(); }
</script>
